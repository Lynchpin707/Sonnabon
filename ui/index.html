<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --side:288px;
  --ink:#14161B;
  --dim:#5C6169;
  --faint:#666B72;
  --hair:rgba(20,22,27,.09);
  --glass:rgba(255,255,255,.55);
  --glass-hi:rgba(255,255,255,.9);
  --gold:#8A6A1E;
  --cheap:#3E7EA6; --mid:#6E7684; --heavy:#C08A2E; --max:#7A4E17;
  --sans:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:16px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#shader{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.app{position:relative;z-index:1;height:100%;display:grid;
  grid-template-columns:var(--side,288px) 1fr;gap:12px;padding:12px}

/* Drag to resize, double click to reset, arrow keys when focused. The width
   is this viewer's own preference, so it lives in their browser and never
   reaches the ledger. */
.grip{position:absolute;top:12px;bottom:12px;width:9px;z-index:4;cursor:col-resize;
  left:calc(12px + var(--side,288px) + 2px);border-radius:5px;
  transition:background .18s}
.grip:hover,.grip.on{background:rgba(20,22,27,.12)}
.grip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* ---------- glass ---------- */
.g{border:1px solid var(--glass-hi);border-radius:16px;background:var(--glass);
  backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),
             inset 0 -1px 0 rgba(20,22,27,.05),
             0 12px 34px rgba(28,32,40,.10)}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;min-height:0;padding:18px 14px}
.head{display:flex;align-items:center;gap:12px;padding:2px 6px 20px}
.head img{width:52px;height:52px;object-fit:contain;flex:none}
.head .n{font-size:15px;font-family:var(--mono);letter-spacing:.18em;color:var(--dim)}
.new{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;margin-bottom:18px;
  border-radius:10px;border:1px solid var(--hair);background:rgba(255,255,255,.5);
  cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink);text-align:left;
  transition:background .2s,border-color .2s}
.new:hover{background:#fff;border-color:rgba(20,22,27,.18)}
.new:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.cases{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.cases::-webkit-scrollbar{width:6px}
.cases::-webkit-scrollbar-thumb{background:rgba(20,22,27,.14);border-radius:3px}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);padding:12px 8px 6px}
.case{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:8px 9px;border-radius:9px;transition:background .18s}
.case:hover{background:rgba(255,255,255,.62)}
.case[aria-current="true"]{background:rgba(255,255,255,.85)}
.case:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.case .t{font-size:15px;line-height:1.35;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.case .s{display:flex;align-items:center;gap:6px;margin-top:4px;
  font-family:var(--mono);font-size:12px;color:var(--faint)}
.pip{width:6px;height:6px;border-radius:50%;flex:none}

.foot{border-top:1px solid var(--hair);padding-top:12px;margin-top:8px;
  font-family:var(--mono);font-size:12px;color:var(--faint);display:grid;gap:6px}
.foot div{display:flex;justify-content:space-between}
.foot b{color:var(--ink);font-weight:400}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 24px;border-bottom:1px solid var(--hair)}
.title{font-size:19px;font-weight:600}
.top .r{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;
  color:var(--dim)}
.top .r b{color:var(--ink);font-weight:400}
.gear{background:none;border:0;padding:5px;border-radius:7px;cursor:pointer;color:var(--dim);
  display:grid;place-items:center;transition:background .2s,color .2s}
.gear:hover,.gear[aria-expanded="true"]{background:rgba(20,22,27,.07);color:var(--ink)}
.gear:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.thread{position:relative;flex:1;overflow-y:auto;min-height:0;padding:28px 24px;
  transition:padding-left .25s ease;display:flex;
  flex-direction:column;gap:22px}
.thread::-webkit-scrollbar{width:8px}
.thread::-webkit-scrollbar-thumb{background:rgba(20,22,27,.13);border-radius:4px}
.turn{max-width:800px;width:100%;margin:0 auto;display:grid;gap:10px}
.you{justify-self:end;max-width:76%;padding:11px 15px;border-radius:14px 14px 4px 14px;
  background:rgba(255,255,255,.78);border:1px solid var(--glass-hi);
  box-shadow:0 2px 8px rgba(28,32,40,.06);font-size:16.5px;line-height:1.55}
.tbi{display:grid;gap:8px}
.stamp{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
  color:var(--faint)}
.stamp b{color:var(--dim);font-weight:400}
.body{font-size:17px;line-height:1.65;color:var(--ink);max-width:68ch}
.body p{margin:0 0 9px}.body p:last-child{margin:0}

/* ---------- composer ---------- */
.composer{padding:12px 20px 18px}
.wrap{max-width:800px;margin:0 auto;display:grid;gap:10px}
.field{display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 17px;
  border-radius:15px;border:1px solid var(--glass-hi);background:rgba(255,255,255,.62);
  backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 26px rgba(28,32,40,.10);
  transition:border-color .25s,box-shadow .25s}
.field:focus-within{border-color:#fff;
  box-shadow:inset 0 1px 0 #fff,0 10px 32px rgba(28,32,40,.15),0 0 0 3px rgba(138,106,30,.13)}
textarea{flex:1;border:0;background:none;resize:none;color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;max-height:200px;padding:6px 0;outline:none}
textarea::placeholder{color:var(--faint)}
.send{flex:none;width:31px;height:31px;border-radius:50%;border:0;cursor:pointer;
  color:var(--faint);background:rgba(20,22,27,.06);display:grid;place-items:center;
  transition:background .2s,color .2s}
.send:not(:disabled){background:var(--ink);color:#fff}
.send:not(:disabled):hover{background:#343841}
.send:disabled{cursor:default}
.send:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.route{display:flex;align-items:center;justify-content:center;gap:7px;min-height:15px;
  font-family:var(--mono);font-size:11px;color:var(--faint);opacity:0;transition:opacity .4s}
.route.on{opacity:1}
.route b{color:var(--ink);font-weight:400}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);
  font-family:var(--mono);font-size:11px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opts{display:flex;gap:14px}
.opt{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);
  font-family:var(--mono);font-size:11px;transition:color .2s}
.opt:hover,.opt[aria-pressed="true"]{color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.panel{position:fixed;top:64px;right:24px;z-index:5;width:268px;padding:16px 18px;
  /* Denser than the rest of the glass on purpose. This is a menu, and the
     heading behind it was reading straight through the frost. */
  background:rgba(255,255,255,.96);max-height:calc(100vh - 96px);overflow-y:auto;
  border-radius:13px;font-family:var(--mono);font-size:11px;color:var(--dim);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel h2{font-size:11px;font-weight:400;color:var(--faint);margin:0 0 10px;letter-spacing:.12em;
  text-transform:uppercase}
.panel .opts{margin-bottom:14px}
.panel .row{display:flex;justify-content:space-between;padding-top:11px;
  border-top:1px solid var(--hair)}
.panel .row b{color:var(--ink);font-weight:400}

.work{display:inline-flex;align-items:center;gap:8px}
.avatar{width:17px;height:17px;image-rendering:pixelated;animation:bob .6s ease-in-out infinite}
.dotb{width:5px;height:5px;border-radius:50%;background:var(--dim);
  animation:bob .6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ---------- empty state ---------- */
.empty{flex:1;display:grid;place-items:center;padding:24px}
.empty-in{display:grid;justify-items:center;gap:24px;max-width:580px;text-align:center}
.empty img{width:148px;height:148px;object-fit:contain;
  filter:drop-shadow(0 10px 26px rgba(28,32,40,.22));
  animation:stamp .85s cubic-bezier(.2,1.5,.4,1) both, float 7s ease-in-out 1s infinite}
.empty h1{font-size:36px;font-weight:500;letter-spacing:-.024em;margin:0;color:var(--ink)}
.empty p{margin:0;color:var(--faint);font-size:16px;max-width:48ch;line-height:1.6}
.empty p b{color:var(--ink);font-weight:500}
.cmd{font-family:var(--mono);font-size:12.5px;color:var(--ink);margin:0;
  background:rgba(20,22,27,.05);border:1px solid var(--hair);border-radius:8px;
  padding:9px 13px;user-select:all}
.seeds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px}
.seed{border:1px solid var(--hair);background:rgba(255,255,255,.6);border-radius:9999px;
  padding:10px 18px;cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--dim);
  display:inline-flex;align-items:center;gap:7px;transition:background .2s,border-color .2s,color .2s}
.seed:hover{background:#fff;color:var(--ink);border-color:rgba(20,22,27,.2)}
.seed:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seed .pip{width:5px;height:5px}

@keyframes stamp{from{opacity:0;transform:scale(1.5) rotate(-9deg)}
                 to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* The seal breathes while the bureau is working. One thing moving in the
   header is a status; two would be decoration. */
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}
                   50%{transform:scale(1.16);opacity:1}}
.head img{transition:transform .3s ease}
.head img.busy{animation:breathe 1.15s ease-in-out infinite}

/* ---------- the spider ----------
   DungeonSpider.png by SpinachChicken, CC0, opengameart.org. 51x20 with four
   12px frames at a 13px pitch. Frames 0 to 2 move her legs; frame 3 draws her
   own silk, which is the clue that she belongs vertically rather than walking
   a floor.

   The rope hangs upward off her back from inside the element that moves, so
   it is attached by construction. Two elements with two transitions had to
   agree on where she was, and they never quite did. */
.runner{position:absolute;top:0;bottom:12px;left:0;right:0;
  overflow:hidden;pointer-events:none;z-index:2}

/* Right against the answer column rather than out in the margin: her whole
   job is to hold the wait, and something in peripheral vision cannot do that.
   The swing runs once and damps to rest, because a pendulum bleeds energy and
   a constant arc repeating forever reads as animation, not as a spider. */
.strand{position:absolute;top:16px;transform-origin:50% 0;
  left:max(14px, calc(50% - 400px - 64px));width:48px;
  animation:settle 4.6s cubic-bezier(.36,0,.64,1) 9.4s forwards}
@keyframes settle{
   0%{transform:rotate(0deg)}
   10%{transform:rotate(4.2deg)}
   24%{transform:rotate(-3.3deg)}
   38%{transform:rotate(2.5deg)}
   52%{transform:rotate(-1.8deg)}
   66%{transform:rotate(1.2deg)}
   79%{transform:rotate(-.7deg)}
   90%{transform:rotate(.3deg)}
  100%{transform:rotate(0deg)}}
.runner.done .strand{animation:none}
/* Narrow windows have no margin to hang her in, so make one. */
@media(max-width:1000px){.thread.busy{padding-left:76px}}

/* Spiders do not glide down a thread, they drop in bursts and stop, and the
   silk is elastic so each stop overshoots and pulls back. Three drops with a
   recoil apiece is worth watching for a few seconds; one smooth slide is not.
   --reach is set per case, because how far she may go depends on the panel. */
.bug{position:absolute;top:0;left:0;width:48px;height:80px;
  animation:descend 13s linear forwards}
@keyframes descend{
    0%{transform:translateY(0)}
    6%{transform:translateY(calc(var(--reach, 120px) * .34))}
    9%{transform:translateY(calc(var(--reach, 120px) * .29))}
   11%{transform:translateY(calc(var(--reach, 120px) * .32))}
   30%{transform:translateY(calc(var(--reach, 120px) * .32))}
   37%{transform:translateY(calc(var(--reach, 120px) * .68))}
   40%{transform:translateY(calc(var(--reach, 120px) * .63))}
   42%{transform:translateY(calc(var(--reach, 120px) * .66))}
   62%{transform:translateY(calc(var(--reach, 120px) * .66))}
   69%{transform:translateY(var(--reach, 120px))}
   72%{transform:translateY(calc(var(--reach, 120px) * .95))}
   75%{transform:translateY(calc(var(--reach, 120px) * .98))}
  100%{transform:translateY(calc(var(--reach, 120px) * .98))}}
.silk{position:absolute;width:1px;height:3000px;top:auto;left:24px;bottom:24px;
  background:#16181C}

/* Inverted to white. One shadow only, as an edge: chaining more shadows makes
   each one shadow the last and she fills in to a blob. */
.sprite{position:absolute;top:0;left:0;width:48px;height:80px;
  image-rendering:pixelated;background-image:url(spider.png);
  background-repeat:no-repeat;background-size:204px 80px;
  filter:invert(1) drop-shadow(0 0 1.4px rgba(20,22,27,.95));
  animation:twitch .34s steps(1) infinite}
@keyframes twitch{0%,32%{background-position:0 0}
                  33%,65%{background-position:-52px 0}
                  66%,100%{background-position:-104px 0}}

/* ---------- rating + forensics ---------- */
.acts{display:flex;align-items:center;gap:4px;margin-top:2px}
.act{border:0;background:none;padding:5px;border-radius:7px;cursor:pointer;color:var(--faint);
  display:grid;place-items:center;transition:background .18s,color .18s}
.act:hover{background:rgba(20,22,27,.06);color:var(--ink)}
.act[aria-pressed="true"]{color:var(--ink);background:rgba(20,22,27,.08)}
.act:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.learned{font-family:var(--mono);font-size:11px;color:var(--gold);margin-left:4px}
.waiting{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* The working notes. Collapsed by default: it is diagnostics, not the answer. */
.think{display:grid;gap:6px;margin-bottom:10px}
.think-head{display:inline-flex;align-items:center;gap:7px;background:none;border:0;
  padding:0;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--faint);
  justify-self:start}
.think-head:hover{color:var(--ink)}
.think-head:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.think-head .arrow{transition:transform .18s ease}
.think-head[aria-expanded="true"] .arrow{transform:rotate(90deg)}
.steps{display:grid;gap:4px;padding:11px 14px;border-radius:9px;
  background:rgba(20,22,27,.035);font-family:var(--mono);font-size:12.5px;
  color:var(--faint)}
.steps div{display:flex;align-items:baseline;gap:9px}
.steps b{color:var(--dim);font-weight:400;min-width:92px}
.steps .n{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
.steps .stop{color:var(--gold)}
.steps .live{color:var(--ink)}
@keyframes tick{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.steps div{animation:tick .16s ease-out both}

.forensic{max-width:800px;width:100%;margin:0 auto;display:flex;gap:11px;padding:13px 15px;
  border-radius:12px;border:1px solid rgba(138,106,30,.28);background:rgba(255,251,240,.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.forensic .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);flex:none;padding-top:2px}
.forensic .v{font-size:15px;line-height:1.6;color:var(--ink)}
.forensic b{font-weight:500}
.adapted{font-family:var(--mono);font-size:11px;color:var(--faint);
  border:1px solid var(--hair);border-radius:5px;padding:1px 5px;cursor:help}

/* ---------- the spending view ---------- */
.views{display:flex;gap:2px}
.views button{background:none;border:0;padding:4px 9px;border-radius:7px;cursor:pointer;
  font-family:var(--mono);font-size:11px;color:var(--faint);transition:background .18s,color .18s}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{background:rgba(20,22,27,.07);color:var(--ink)}
.views button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.dash{flex:1;overflow-y:auto;min-height:0;padding:22px 26px 40px}
.dash::-webkit-scrollbar{width:8px}
.dash::-webkit-scrollbar-thumb{background:rgba(20,22,27,.13);border-radius:4px}
.dash-in{max-width:820px;margin:0 auto;display:grid;gap:34px}

.head-figs{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-end}
.fig{display:grid;gap:3px}
.fig .v{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1;
  font-variant-numeric:tabular-nums}
.fig .k{font-family:var(--mono);font-size:12px;color:var(--faint)}
.fig.quiet .v{font-size:19px;color:var(--dim);font-weight:400}

.sect{display:grid;gap:11px}
.sect h2{font-family:var(--mono);font-size:12px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--faint);font-weight:400}
.sect .why{font-size:15px;color:var(--faint);line-height:1.55;margin:-4px 0 2px}

.grid{display:grid;gap:9px;font-family:var(--mono);font-size:12.5px}
.grid .hd{display:grid;grid-template-columns:74px 1fr 74px 84px 62px;gap:10px;
  color:var(--faint);padding-bottom:5px;border-bottom:1px solid var(--hair)}
.grid .rw{display:grid;grid-template-columns:74px 1fr 74px 84px 62px;gap:10px;
  align-items:center}
.grid .rw span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:rgba(20,22,27,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;padding:1px 5px;border-radius:3px;color:#fff;
  font-family:var(--sans)}

.days{display:flex;align-items:flex-end;gap:3px;height:74px}
.day{flex:1;min-width:3px;background:rgba(20,22,27,.14);border-radius:2px 2px 0 0}
.day.hot{background:var(--gold)}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10.5px;color:var(--faint)}

.blank{font-size:14px;color:var(--faint);border:1px dashed var(--hair);
  border-radius:9px;padding:13px 15px;line-height:1.5}
.blank b{color:var(--ink);font-weight:500}

/* One row per model call, as the Strands hooks recorded it. */
.calls{font-family:var(--mono);font-size:11px;color:var(--faint);display:grid;gap:4px;
  margin-top:8px;padding:9px 12px;border-radius:9px;background:rgba(20,22,27,.035)}
.calls div{display:flex;align-items:baseline;gap:10px}
.calls b{color:var(--dim);font-weight:400;min-width:96px}
.calls .n{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.calls .stop b,.calls .stop{color:var(--gold)}
.calls .sum{border-top:1px solid var(--hair);padding-top:5px;margin-top:2px;color:var(--dim)}
.disclose{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);
  font-family:var(--mono);font-size:11px;text-decoration:underline;text-underline-offset:3px}
.disclose:hover{color:var(--ink)}
.disclose:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.approve{max-width:800px;width:100%;margin:0 auto;display:grid;gap:11px;padding:14px 16px;
  border-radius:12px;border:1px solid rgba(138,106,30,.34);background:rgba(255,251,240,.78);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.approve .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold)}
.approve .v{font-size:15px;line-height:1.6}
.approve .row{display:flex;gap:9px}

</style>
</head>
<body>
<canvas id="shader" aria-hidden="true"></canvas>

<div class="app">
  <div class="grip" id="grip" role="separator" aria-orientation="vertical"
       aria-label="Resize sidebar" tabindex="0"></div>
  <aside class="g side">
    <div class="head">
      <img src="logo.png" alt="">
      <span class="n">TBI</span>
    </div>
    <button class="new" id="new">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      New case
    </button>
    <div class="cases" id="cases"></div>
    <div class="foot">
      <div><span>today</span><b id="fToday">--</b></div>
      <div><span>this month</span><b id="fMonth">--</b></div>
      <div><span>saved by routing</span><b id="fSaved">--</b></div>
      <div><span>backend</span><b id="backend">--</b></div>
    </div>
  </aside>

  <section class="g main">
    <div class="top">
      <span class="title" id="title">New case</span>
      <div class="r">
        <div class="views" id="views">
          <button type="button" data-view="cases" aria-pressed="true">cases</button>
          <button type="button" data-view="spend" aria-pressed="false">spending</button>
        </div>
        <span>today <b id="today">--</b></span>
        <button class="gear" id="gear" aria-expanded="false" aria-controls="panel" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1.6v1.7M8 12.7v1.7M14.4 8h-1.7M3.3 8H1.6M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2M12.5 12.5l-1.2-1.2M4.7 4.7L3.5 3.5"
                  stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="thread" id="thread"></div>
    <div class="dash" id="dash" hidden></div>
<template id="spriteTpl">
  <div class="runner" aria-hidden="true">
    <div class="strand"><div class="bug">
      <div class="silk"></div><div class="sprite"></div></div></div>
  </div>
</template>

    <div class="composer">
      <div class="wrap">
        <div class="field">
          <textarea id="input" rows="1" placeholder="What do you need done?"
                    aria-label="Your request"></textarea>
          <button class="send" id="send" type="button" disabled aria-label="Send">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor"
                    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="route" id="route" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>
</div>

<div class="g panel" id="panel" role="dialog" aria-label="Settings">
  <h2>Never route above</h2>
  <div class="opts" id="ceil"></div>
  <label for="habit">Compare against</label>
  <select id="habit">
    <option value="cheap">cheap</option><option value="mid">mid</option>
    <option value="heavy">heavy</option><option value="max">max</option>
  </select>
  <h2>Answering right now</h2>
  <div class="cat" id="catalogue"></div>
  <div class="row"><span>cases today</span><b id="nCases">0</b></div>
  <div class="row"><span>backend</span><b id="panelBackend">--</b></div>
  <p class="foot-note">Which models exist, and any keys they need, live in
     <code>src/config.py</code>. A running instance cannot point itself
     somewhere new from a web form.</p>
</div>

<script>
const ORDER = ["cheap", "mid", "heavy", "max"];
const COLOR = {cheap:"var(--cheap)", mid:"var(--mid)", heavy:"var(--heavy)", max:"var(--max)"};
const usd = v => v < 0.001 ? "$" + v.toFixed(6) : "$" + v.toFixed(4);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
const attr = x => String(x).replace(/"/g, "&quot;");

/* Model names, tiers and costs all come from the server. Nothing on this page
   predicts a price or mirrors a routing rule. A copy kept here would drift
   from src/ the first time somebody changed a tier, and a number this file
   invented would look exactly like one a provider actually charged. */
let MODELS = {}, CASES = [], TURNS = {};
let offline = false, note = null;
let openCase = null;     // the conversation on screen; null means a new one
let waiting = null;      // the turn we are still waiting on
let steps = [];          // what the hooks have reported for it so far
let showSteps = false;   // diagnostics stay closed until asked for
let gate = null;         // a turn the bureau stopped to ask about
let pick = null, choosing = false, overridden = false;
let ceiling = "max", habit = "max";

const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("input"), send = $("send"), routeEl = $("route"),
      casesEl = $("cases"), panel = $("panel"), gear = $("gear"), ceilEl = $("ceil");

/* One per lane, in order: cheap and solo, mid and solo, heavy and the full
   team, then one the bureau stops and asks you about first. */
const SEEDS = [
  "Summarise this sales call transcript into next steps and owners",
  "Write the SQL for monthly active users by plan tier",
  "Review the vendor contract redline and flag what I should push back on",
  "Should we terminate the reseller agreement this quarter"
];

/* ------------------------------------------------------------ sidebar width */

const SIDE_MIN = 140, SIDE_MAX = 560, SIDE_DEFAULT = 288;
const grip = $("grip");

function setSide(width) {
  const w = Math.max(SIDE_MIN, Math.min(SIDE_MAX, Math.round(width)));
  document.documentElement.style.setProperty("--side", w + "px");
  grip.setAttribute("aria-valuenow", w);
  try { localStorage.setItem("tbi.side", w); } catch (err) { /* private window */ }
}
function currentSide() {
  return parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--side")) || SIDE_DEFAULT;
}
try {
  const saved = Number(localStorage.getItem("tbi.side"));
  if (saved) setSide(saved);
} catch (err) { /* storage can be blocked; the default width is fine */ }

grip.addEventListener("pointerdown", e => {
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  grip.classList.add("on");
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";

  const move = ev => setSide(ev.clientX - 12);
  const up = ev => {
    grip.classList.remove("on");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    try { grip.releasePointerCapture(ev.pointerId); } catch (err) { /* gone */ }
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", up);
    grip.removeEventListener("pointercancel", up);
  };
  /* Capture puts the events on the handle, so a drag that outruns it keeps
     going instead of stopping the moment the cursor leaves. */
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
  grip.addEventListener("pointercancel", up);
});
grip.addEventListener("dblclick", () => setSide(SIDE_DEFAULT));
grip.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { setSide(currentSide() - 16); e.preventDefault(); }
  if (e.key === "ArrowRight") { setSide(currentSide() + 16); e.preventDefault(); }
  if (e.key === "Home") { setSide(SIDE_DEFAULT); e.preventDefault(); }
});

/* ------------------------------------------------------------------ sidebar */

function drawCases() {
  let html = "", last = null;
  CASES.forEach(c => {
    if (c.day !== last) { html += `<div class="grp">${c.day}</div>`; last = c.day; }
    const turns = c.turns > 1 ? `<span>${c.turns} turns</span>` : "";
    html += `<button class="case" data-id="${attr(c.id)}"
        aria-current="${c.id === openCase}">
      <span class="t">${esc(c.title)}</span>
      <span class="s"><span class="pip" style="background:${COLOR[c.tier] || "var(--mid)"}"></span>${esc(c.tier)}
        <span>${usd(c.cost)}</span>${turns}</span></button>`;
  });
  casesEl.innerHTML = html;
}

/* ------------------------------------------------------------- empty states */

function emptyState() {
  $("title").textContent = "New case";
  if (offline) {
    thread.innerHTML = `<div class="empty"><div class="empty-in">
      <img src="logo.png" alt="">
      <h1>Not connected</h1>
      <p>The interface is open but the bureau is not running, so there is nothing
         real to show and nothing invented in its place. Start it and reload:</p>
      <pre class="cmd">python ui/server.py</pre>
      <p>That serves this page at <b>localhost:8756</b> and runs every request
         through the same code the tests use. Add <b>USE_AWS=true</b> for Bedrock;
         without it, requests go to Ollama on localhost:11434 and cost nothing.</p>
    </div></div>`;
    return;
  }
  thread.innerHTML = `<div class="empty"><div class="empty-in">
    <img src="logo.png" alt="">
    <h1>What do you need done?</h1>
    <p>Write it the way you would say it. The bureau reads it, picks the model the
       work actually needs, and keeps the receipt.</p>
    <div class="seeds">${SEEDS.map(x =>
      `<button class="seed" data-s="${attr(x)}">${esc(x)}</button>`).join("")}
    </div>
  </div></div>`;
}

/* --------------------------------------------------------------- the record */

function turnHtml(turn, index, all) {
  if (turn.role === "you") {
    return `<div class="turn"><div class="you">${esc(turn.text)}</div></div>`;
  }
  const calls = turn.calls || [];
  const detail = calls.length
    ? `<button type="button" class="disclose" data-open="${index}">${calls.length} calls</button>`
    : "";
  const rows = calls.map(k => `<div><b>${esc(k.agent)}</b>
      <span>${esc(k.tier)}</span>
      <span>${k.input_tokens} in, ${k.output_tokens} out</span>
      <span class="n">${usd(k.cost)}</span></div>`).join("");
  const stopped = (turn.blocks || []).map(b => `<div class="stop"><b>stopped</b>
      <span>${esc(b.reason)}</span></div>`).join("");
  const compare = turn.baseline > turn.cost
    ? `<div class="sum"><b>on ${esc(MODELS[habit] || habit)}</b>
       <span class="n">${usd(turn.baseline)}</span></div>` : "";
  const last = index === all.length - 1;
  return `<div class="turn"><div class="tbi">
      <div class="stamp">
        <span class="pip" style="background:${COLOR[turn.tier] || "var(--mid)"}"></span>
        <b>${esc(turn.tier)}</b><span>${esc(MODELS[turn.tier] || "")}</span>
        <span>${usd(turn.cost)}</span>
        ${turn.path ? `<span>${esc(turn.path)}</span>` : ""}${detail}
      </div>
      <div class="calls" id="calls${index}" hidden>${rows}${stopped}${compare}</div>
      <div class="body"><p>${esc(turn.text)}</p></div>
      ${last ? rateHtml(turn) : ""}
    </div></div>`;
}

function rateHtml(turn) {
  return `<div class="acts">
      <button class="act" data-r="ok" data-id="${attr(turn.id)}"
              data-tier="${attr(turn.tier)}" aria-label="Good answer">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 8.6l2.6 2.6L12 5.8"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="act" data-r="bad" data-id="${attr(turn.id)}"
              data-tier="${attr(turn.tier)}" aria-label="Not good enough">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M5 5l6 6M11 5l-6 6"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>`;
}

function stepsHtml() {
  /* Every line is one Strands hook. A model call that happened and a tool the
     coordinator reached for both show up here, so the difference between one
     agent and six is visible rather than inferred. */
  if (!steps.length) return "";
  const rows = steps.map(step => {
    if (step.kind === "tool") {
      return step.state === "start"
        ? `<div class="live"><b>${esc(step.agent)}</b><span>consulting</span></div>`
        : `<div><b>${esc(step.agent)}</b><span>answered</span>
           <span class="n">${step.seconds}s</span></div>`;
    }
    if (step.kind === "block") {
      return `<div class="stop"><b>stopped</b><span>${esc(step.reason)}</span></div>`;
    }
    return `<div><b>${esc(step.agent)}</b><span>${esc(step.tier)}</span>
      <span>${step.input_tokens} in, ${step.output_tokens} out</span>
      <span>${step.seconds}s</span>
      <span class="n">${usd(step.cost)}</span></div>`;
  }).join("");
  const calls = steps.filter(s => s.kind === "call").length;
  const spent = steps.reduce((t, s) => t + (s.cost || 0), 0);
  const elapsed = steps.reduce((t, s) => Math.max(t, s.at || 0), 0);
  return `<div class="think">
    <button type="button" class="think-head" id="thinkToggle"
            aria-expanded="${showSteps}">
      <svg class="arrow" width="9" height="9" viewBox="0 0 8 8" fill="none"
           aria-hidden="true"><path d="M2.5 1L6 4L2.5 7" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ${calls} call${calls === 1 ? "" : "s"}, ${elapsed.toFixed(1)}s, ${usd(spent)}
    </button>
    ${showSteps ? `<div class="steps">${rows}</div>` : ""}
  </div>`;
}

function approvalCard(ask) {
  return `<div class="approve">
    <span class="k">Your call</span>
    <span class="v">This reads as <b>${esc(ask.risk)}</b> risk and wants the
      <b>${esc(ask.tier)}</b> tier (${esc(ask.model)}), above your standing ceiling
      of <b>${esc(ask.ceiling)}</b>. Nothing has run and nothing has been billed.</span>
    <div class="row">
      <button type="button" class="yes" data-ok="1">Authorise</button>
      <button type="button" data-ok="0">Decline</button>
    </div>
  </div>`;
}

function drawThread() {
  raiseSpiders();
  const turns = (openCase && TURNS[openCase]) || [];

  if (!turns.length && !waiting && !gate) { emptyState(); return; }

  const head = CASES.find(c => c.id === openCase);
  $("title").textContent = head ? head.title
    : (waiting ? waiting.text : "New case");

  let html = note ? `<div class="forensic"><span class="k">Forensics</span>
      <span class="v">${esc(note)}</span></div>` : "";
  html += turns.map((t, i) => turnHtml(t, i, turns)).join("");

  if (waiting) {
    html += `<div class="turn"><div class="you">${esc(waiting.text)}</div></div>`;
    if (gate) html += approvalCard(gate);
    else html += `<div class="turn"><div class="tbi">${stepsHtml()}
        <div class="body">
        <span class="waiting">the bureau is reading the case</span></div></div></div>`;
  }

  thread.innerHTML = html;
  if (waiting && !gate) lowerSpiders();
  thread.scrollTop = thread.scrollHeight;
}

/* --------------------------------------------------------------- the spider */

let spiderStop = null;

/* How far each may go and how long she takes. The easing is a strong ease
   out, so most of the distance goes early and they creep afterwards: a two
   second call and a forty second call both read, and neither reaches the
   bottom. The browser runs the transition, so it keeps going when the tab is
   in the background. requestAnimationFrame does not. */
const DROP_MAX = 132;

function lowerSpiders() {
  raiseSpiders();
  thread.classList.add("busy");
  thread.appendChild($("spriteTpl").content.cloneNode(true));
  const runner = thread.querySelector(".runner");

  const bug = runner.querySelector(".bug");
  const reach = Math.min(DROP_MAX, Math.max(runner.clientHeight - 108, 24));
  bug.style.setProperty("--reach", reach + "px");

  spiderStop = () => {
    /* They let go: the threads whip up and both fall out of frame. */
    runner.classList.add("done");
    const fall = runner.clientHeight + 120;
    bug.style.animation = "none";
    bug.style.transition = "transform .5s cubic-bezier(.55,0,.9,.45), " +
                           "opacity .4s ease-in .2s";
    bug.getBoundingClientRect();            // keep where she was, then let go
    bug.style.transform = "translateY(" + fall + "px)";
    bug.style.opacity = "0";
    setTimeout(() => runner.remove(), 700);
    spiderStop = null;
  };
}

function raiseSpiders() {
  if (spiderStop) spiderStop();
  thread.classList.remove("busy");
  thread.querySelectorAll(".runner").forEach(node => node.remove());
}

/* -------------------------------------------------------------- interaction */

thread.addEventListener("click", e => {
  const seed = e.target.closest(".seed");
  if (seed) {
    input.value = seed.dataset.s;
    input.dispatchEvent(new Event("input"));
    input.focus();
    return;
  }
  if (e.target.closest("#thinkToggle")) {
    showSteps = !showSteps;
    drawThread();
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open) {
    const box = $("calls" + open.dataset.open);
    if (box) box.hidden = !box.hidden;
    return;
  }
  const answer = e.target.closest("[data-ok]");
  if (answer) {
    if (answer.dataset.ok === "1") { submit(waiting.text, true); return; }
    gate = null;
    waiting = null;
    drawThread();
    return;
  }
  const act = e.target.closest(".act");
  if (act) {
    const on = act.getAttribute("aria-pressed") === "true";
    [...act.parentElement.children].forEach(b =>
      b.setAttribute("aria-pressed", String(b === act && !on)));
    if (on) return;
    /* memory.escalate reads a negative mean, so a rejection is -1. Sending 0
       would record the complaint and change nothing. */
    fetch("/api/rate", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: act.dataset.id, tier: act.dataset.tier,
                            rating: act.dataset.r === "ok" ? 1 : -1})
    }).then(() => refresh(false)).catch(() => {});
  }
});

casesEl.addEventListener("click", async e => {
  const button = e.target.closest(".case");
  if (!button) return;
  openCase = button.dataset.id;
  waiting = gate = null;
  await loadCase(openCase);
  drawCases();
  drawThread();
});

$("new").addEventListener("click", () => {
  openCase = null; waiting = gate = null; overridden = false; pick = null;
  drawCases(); drawThread(); input.focus();
});

async function loadCase(id) {
  try {
    const d = await (await fetch("/api/case?id=" + encodeURIComponent(id))).json();
    TURNS[id] = d.turns || [];
  } catch (err) { TURNS[id] = TURNS[id] || []; }
}

/* The bureau chooses the model, because six agent calls against one is a
   latency decision as much as a cost one. The override is here because
   somebody who knows the work beats a guess about it, but it is opt in, and
   it never shows a price before a provider has charged one. */
function drawRoute() {
  if (!input.value.trim()) { routeEl.classList.remove("on"); return; }
  routeEl.classList.add("on");
  routeEl.innerHTML = choosing
    ? '<span class="opts">' + ORDER.map(k =>
        `<button type="button" class="opt" data-k="${k}" aria-pressed="${k === pick}">${k}</button>`
      ).join("") + '</span>'
    : overridden
      ? `<b>${esc(pick)}</b><span>${esc(MODELS[pick] || "")}</span>
         <button type="button" class="link" id="chg">let the bureau choose</button>`
      : `<span>the bureau picks the model</span>
         <button type="button" class="link" id="chg">choose it yourself</button>`;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
  send.disabled = !input.value.trim();
  drawRoute();
});
routeEl.addEventListener("click", e => {
  if (e.target.id === "chg") {
    if (overridden) { overridden = false; pick = null; drawRoute(); return; }
    choosing = true;
    drawRoute();
    routeEl.querySelector(".opt").focus();
    return;
  }
  const o = e.target.closest(".opt");
  if (o) { pick = o.dataset.k; overridden = true; choosing = false; drawRoute(); }
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
send.addEventListener("click", () => submit());

/* ------------------------------------------------------------------ sending */

async function submit(text, approved) {
  const asked = (text !== undefined ? text : input.value).trim();
  if (!asked) return;
  const forced = overridden ? pick : null;
  if (text === undefined) { input.value = ""; input.style.height = "auto"; }
  send.disabled = true;
  routeEl.classList.remove("on");

  waiting = {text: asked};
  gate = null;
  steps = [];
  drawThread();
  document.querySelector(".head img").classList.add("busy");

  let failure = null, finished = null;
  try {
    const res = await fetch("/api/ask", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: asked, tier: forced, approved: !!approved,
                            case_id: openCase, stream: true})});

    /* One line of JSON per step, the last one carrying the answer. Reading it
       as it arrives is what makes the working notes live rather than a
       replay of something already over. */
    const reader = res.body.getReader();
    const decode = new TextDecoder();
    let buffer = "";
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decode.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let parsed;
        try { parsed = JSON.parse(line); } catch (err) { continue; }
        if (parsed.step) { steps.push(parsed.step); drawThread(); }
        if (parsed.done) finished = parsed.done;
      }
    }
  } catch (err) {
    failure = String(err.message || err);
  }

  if (finished) {
    if (finished.needs_approval) gate = finished.needs_approval;
    else if (finished.error) failure = finished.error;
    else if (finished.declined) failure = "Declined. Nothing ran and nothing was billed.";
    else {
      openCase = finished.case_id;
      await loadCase(openCase);
      waiting = null;
      await refresh(false);
    }
  } else if (!failure) {
    failure = "The connection closed before the bureau answered.";
  }

  if (failure) {
    waiting = null;
    gate = null;
    thread.innerHTML = `<div class="turn"><div class="you">${esc(asked)}</div></div>
      <div class="turn"><div class="tbi"><div class="forensic">
        <span class="k">Stopped</span><span class="v">${esc(failure)}</span>
      </div></div></div>`;
    raiseSpiders();
  } else {
    drawCases();
    drawThread();
  }
  overridden = false; pick = null;
  send.disabled = !input.value.trim();
  document.querySelector(".head img").classList.remove("busy");
}

/* ------------------------------------------------------------------ reading */

async function refresh(redraw = true) {
  try {
    const d = await (await fetch("/api/state")).json();
    offline = false;
    MODELS = d.models || {};
    ceiling = d.ceiling;
    habit = d.habit;
    /* A case still waiting on the model is not in the ledger yet. The health
       probe makes this request slow, so without this a reply that lands while
       the page is loading gets erased by the load. */
    CASES = d.history;
    $("today").textContent = $("fToday").textContent = usd(d.today);
    $("fMonth").textContent = usd(d.month);
    $("fSaved").textContent = d.saved == null ? "--" : d.saved + "%";
    $("nCases").textContent = d.history.filter(h => h.day === "Today").length;
    $("backend").textContent = d.backend;
    $("backend").title = d.backend_detail || "";
    $("panelBackend").textContent = d.backend;
    $("panelBackend").title = d.backend_detail || "";
    drawSettings();
    if (redraw) { drawCases(); drawThread(); }
  } catch (err) {
    offline = true;
    if (redraw) { drawCases(); drawThread(); }
  }
}

/* Speaks only when something needs a decision, so an empty reply shows nothing
   rather than a reassuring sentence nobody asked for. */
fetch("/api/forensics").then(r => r.json()).then(d => {
  if (d && d.note) { note = d.note; drawThread(); }
}).catch(() => {});

/* ------------------------------------------------------------ the spending */

let view = "cases", usage = null;

const pct = (part, whole) => whole > 0 ? Math.round(100 * part / whole) : 0;
const secs = v => v >= 10 ? v.toFixed(0) + "s" : v.toFixed(1) + "s";

function setView(next) {
  view = next;
  [...$("views").children].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === next)));
  $("thread").hidden = next !== "cases";
  $("dash").hidden = next !== "spend";
  document.querySelector(".composer").hidden = next !== "cases";
  if (next === "spend") drawDash();
}

$("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (b) setView(b.dataset.view);
});

function bars(rows, total, colour) {
  /* One row per group, widths in proportion to spend. Nothing is drawn for a
     group with no spend, because a bar of zero width still reads as a bar. */
  return rows.map(([name, e]) => `<div class="rw">
      <span>${colour ? `<i class="tag" style="background:${COLOR[name] || "var(--mid)"}">${esc(name)}</i>`
                     : esc(name.replace(/_/g, " "))}</span>
      <span class="bar"><i style="width:${pct(e.cost, total)}%;
        background:${colour ? (COLOR[name] || "var(--mid)") : "var(--dim)"}"></i></span>
      <span>${usd(e.cost)}</span>
      <span>${e.cost_per_accepted == null ? "--" : usd(e.cost_per_accepted)}</span>
      <span>${e.accept_rate == null ? "--" : Math.round(e.accept_rate * 100) + "%"}</span>
    </div>`).join("");
}

function worth(quality, spent) {
  const tiers = Object.entries(quality.by_tier)
    .sort((a, b) => b[1].cost - a[1].cost);
  if (!tiers.length) {
    return `<div class="blank"><b>Nothing measured yet.</b> Run a case and this
      fills in with what it actually cost.</div>`;
  }
  const rated = tiers.some(([, e]) => e.rated > 0);
  const note = rated ? "" : `<div class="blank">Costs are here, but nothing has
      been rated yet, so the two columns on the right are still unknown. Rate an
      answer and this becomes the only number that matters.</div>`;
  return `<div class="grid">
      <div class="hd"><span>tier</span><span>share of spend</span><span>spent</span>
        <span>per accepted</span><span>accepted</span></div>
      ${bars(tiers, spent, true)}
    </div>${note}`;
}

function whereItWent(quality, spent) {
  const domains = Object.entries(quality.by_domain)
    .sort((a, b) => b[1].cost - a[1].cost).slice(0, 8);
  if (!domains.length) {
    return `<div class="blank"><b>No work recorded yet.</b></div>`;
  }
  return `<div class="grid">
      <div class="hd"><span>work</span><span>share of spend</span><span>spent</span>
        <span>per accepted</span><span>accepted</span></div>
      ${bars(domains, spent, false)}
    </div>`;
}

function daily(days) {
  if (!days.length) return `<div class="blank"><b>No days recorded yet.</b></div>`;
  const peak = Math.max(...days.map(d => d.cost), 0);
  const median = [...days].map(d => d.cost).sort((a, b) => a - b)[Math.floor(days.length / 2)];
  return `<div class="days">${days.map(d => {
      const high = median > 0 && d.cost > median * 2;
      return `<div class="day${high ? " hot" : ""}" title="${d.day}: ${usd(d.cost)}"
        style="height:${peak > 0 ? Math.max(3, 100 * d.cost / peak) : 3}%"></div>`;
    }).join("")}</div>
    <div class="axis"><span>${esc(days[0].day)}</span>
      <span>${esc(days[days.length - 1].day)}</span></div>`;
}

function adaptation(split) {
  const rows = Object.entries(split);
  const anyRated = rows.some(([, e]) => e.accepted > 0);
  if (!rows.length) return `<div class="blank"><b>Nothing recorded yet.</b></div>`;
  if (!anyRated) {
    return `<div class="blank">The system fits the wording to the model that
      answers. Whether that helps is a question about ratings, and nothing has
      been rated yet. Until then this is an open question, not a claim.</div>`;
  }
  return `<div class="grid">
      <div class="hd"><span>prompt</span><span></span><span>requests</span>
        <span>per accepted</span><span>accepted</span></div>
      ${rows.map(([name, e]) => `<div class="rw">
        <span>${esc(name)}</span><span></span><span>${e.n}</span>
        <span>${e.cost_per_accepted == null ? "--" : usd(e.cost_per_accepted)}</span>
        <span>${e.accept_rate == null ? "--" : Math.round(e.accept_rate * 100) + "%"}</span>
      </div>`).join("")}
    </div>`;
}

function changed(flagged) {
  if (!flagged.length && !note) {
    return `<div class="blank">Nothing unusual. The bureau speaks only when
      something needs a decision.</div>`;
  }
  const rows = flagged.map(f => `<div class="rw"><span>${esc(f.user)}</span>
      <span></span><span>${usd(f.latest)}</span><span>${usd(f.median)}</span>
      <span></span></div>`).join("");
  return (note ? `<div class="forensic"><span class="k">Forensics</span>
      <span class="v">${esc(note)}</span></div>` : "")
    + (rows ? `<div class="grid"><div class="hd"><span>who</span><span></span>
        <span>latest</span><span>usual</span><span></span></div>${rows}</div>` : "");
}

async function drawDash() {
  const box = $("dash");
  try {
    usage = await (await fetch("/api/usage")).json();
  } catch (err) {
    box.innerHTML = `<div class="dash-in"><div class="blank">
      <b>Cannot reach the bureau.</b> Nothing is shown rather than something
      invented.</div></div>`;
    return;
  }
  const t = usage.totals, q = usage.quality;
  const habit = (usage.habit_model || "").split(".").pop();

  box.innerHTML = `<div class="dash-in">
    <div class="head-figs">
      <div class="fig"><span class="v">${usd(t.cost)}</span>
        <span class="k">spent, last 30 days</span></div>
      <div class="fig quiet"><span class="v">${usd(t.baseline)}</span>
        <span class="k">the same work on ${esc(habit || "the usual model")}</span></div>
      <div class="fig quiet"><span class="v">${t.saved_pct == null ? "--" : t.saved_pct + "%"}</span>
        <span class="k">less</span></div>
      <div class="fig quiet"><span class="v">${t.cases}</span>
        <span class="k">cases, ${t.calls} model calls</span></div>
      <div class="fig quiet"><span class="v">${t.seconds ? secs(t.seconds) : "--"}</span>
        <span class="k">spent waiting</span></div>
    </div>

    <div class="sect">
      <h2>Was it worth it</h2>
      <p class="why">Spend divided by the answers you actually accepted. A cheap
        tier you reject half the time can cost more per useful answer than a
        dearer one that lands, and no bill can see a rejection.</p>
      ${worth(q, t.cost)}
    </div>

    <div class="sect">
      <h2>Where it went</h2>
      ${whereItWent(q, t.cost)}
    </div>

    <div class="sect">
      <h2>By day</h2>
      ${daily(usage.daily)}
    </div>

    <div class="sect">
      <h2>Does fitting the prompt help</h2>
      ${adaptation(q.by_adaptation)}
    </div>

    <div class="sect">
      <h2>What changed</h2>
      ${changed(usage.anomalies || [])}
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- settings */

function drawSettings() {
  ceilEl.innerHTML = ORDER.map(k =>
    `<button type="button" class="opt" data-c="${k}" aria-pressed="${k === ceiling}">${k}</button>`
  ).join("");
  if ($("habit").value !== habit) $("habit").value = habit;

  /* What each tier actually reaches, read from the server rather than written
     here. A list kept in this file would disagree with config.py the first
     time somebody changed a model, and disagree silently. */
  $("catalogue").innerHTML = ORDER.map(k => `<div>
      <b>${k}</b><span title="${attr(MODELS[k] || "")}">${esc(MODELS[k] || "--")}</span>
    </div>`).join("");
}

async function saveSettings(patch) {
  try {
    const res = await fetch("/api/settings", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(patch)});
    const d = await res.json();
    if (d.error) return;
    ceiling = d.ceiling;
    habit = d.habit;
    drawSettings();
    refresh(false);
  } catch (err) { /* the panel keeps showing what the server last confirmed */ }
}

ceilEl.addEventListener("click", e => {
  const b = e.target.closest(".opt");
  if (b) saveSettings({ceiling: b.dataset.c});
});
$("habit").addEventListener("change", e => saveSettings({habit: e.target.value}));

gear.addEventListener("click", () =>
  gear.setAttribute("aria-expanded", panel.classList.toggle("on")));
addEventListener("keydown", e => {
  if (e.key === "Escape" && panel.classList.contains("on")) {
    panel.classList.remove("on");
    gear.setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("click", e => {
  if (!panel.contains(e.target) && !gear.contains(e.target)
      && panel.classList.contains("on")) {
    panel.classList.remove("on");
    gear.setAttribute("aria-expanded", "false");
  }
});

refresh();

/* Background only: two very large soft fields, blue and gold, on white. The
   glass above is CSS, which now has real content behind it to blur. */
(function(){
  const cv=$("shader"), gl=cv.getContext("webgl",{antialias:false});
  if(!gl){cv.style.background=
    "radial-gradient(58% 48% at 78% 22%,#F6E7C0,transparent),"+
    "radial-gradient(58% 48% at 18% 82%,#CFDDF0,transparent),#fff";return}
  const fs=`precision highp float;
  uniform vec2 r; uniform float t;
  float dither(vec2 p){return fract(52.9829189*fract(dot(p,vec2(.06711056,.00583715))));}
  void main(){
    vec2 uv=gl_FragCoord.xy/r; float ar=r.x/r.y;
    vec2 p=(uv-.5)*vec2(ar,1.);
    /* A slow swell across the whole field. Two waves at different rates and
       angles, so it never repeats visibly and never reads as a loop. */
    p += vec2(sin(p.y*1.7 + t*.19)*.020 + sin(p.y*0.8 - t*.11)*.014,
              cos(p.x*1.4 + t*.16)*.017 + cos(p.x*0.6 + t*.09)*.012);
    /* Weight-normalised: two lights combining, not one paint over another.
       mix() in sequence let the blue erase most of the gold's chroma. */
    vec2 g=p-vec2(.78+sin(t*.061)*.19, .50+cos(t*.048)*.14);
    vec2 b=p-vec2(-.82+cos(t*.044)*.21,-.56+sin(t*.053)*.15);
    /* And each one breathes, so the light is never quite the same size twice. */
    float wg=exp(-dot(g,g)*(.42+sin(t*.13)*.055))*.95,
          wb=exp(-dot(b,b)*(.38+cos(t*.10)*.050))*.95;
    float w=wg+wb;
    vec3 tint=(vec3(.973,.898,.718)*wg+vec3(.776,.851,.953)*wb)/max(w,1e-4);
    vec3 c=mix(vec3(1.),tint,min(w,1.));
    gl_FragColor=vec4(c+(dither(gl_FragCoord.xy)-.5)/255.,1.);
  }`;
  const mk=(ty,src)=>{const o=gl.createShader(ty);gl.shaderSource(o,src);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
  const pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,"p");
  gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const ur=gl.getUniformLocation(pr,"r"),ut=gl.getUniformLocation(pr,"t");
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const size=()=>{const d=Math.min(devicePixelRatio||1,2);
    cv.width=innerWidth*d; cv.height=innerHeight*d; gl.viewport(0,0,cv.width,cv.height)};
  const draw=ms=>{
    gl.uniform2f(ur,cv.width,cv.height);
    gl.uniform1f(ut,still?20:ms/1000);
    gl.drawArrays(gl.TRIANGLES,0,3); requestAnimationFrame(draw)};
  addEventListener("resize",size); size(); requestAnimationFrame(draw);
})();
</script>
