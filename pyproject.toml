[project]
name = "tbi"
version = "0.1.0"
description = "Token routing gateway with measured cost accounting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.86",
    "diagrams>=0.25.1",
    "ollama>=0.6.0",
    "openai>=3.11.0",
    "python-dotenv>=1.2.3",
    "strands-agents>=1.54.0",
]

[project.scripts]
sonnabon = "src.bakery.cli:serve"
sonnabon-generate = "src.bakery.cli:generate"
sonnabon-backtest = "src.bakery.cli:backtest"
sonnabon-reset = "src.bakery.cli:reset"
sonnabon-clear = "src.bakery.cli:clear"

[project.optional-dependencies]
# Only needed if you give it a TAVILY_API_KEY. Without one it says web search
# is not configured rather than inventing an event, so this stays optional.
search = ["strands-agents-tools>=0.2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
