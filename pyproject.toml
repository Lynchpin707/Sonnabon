[project]
name = "tbi"
version = "0.1.0"
description = "Token routing gateway with measured cost accounting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.86",
    "ollama>=0.6.0",
    "strands-agents>=1.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
